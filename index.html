<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Detroit Sports Board</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /************************************************************
         * BASE
         ************************************************************/

        :root {
            --text: #111;
            --muted: #555;
            --scheduled: #06c;
            --live: #c00;
            --final: #087b2f;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent !important;
            overflow: hidden;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        .wrapper {
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        .scoreboard {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: flex-start;
            gap: 1.5rem;
        }


        /************************************************************
         * STICKY NOTE CARDS
         ************************************************************/

        .team-card {
            display: none;
            width: 240px;
            padding: 1.25rem 1.5rem;
            border-radius: 0.75rem;
            background: #fff8b3;

            background-image:
                radial-gradient(
                    circle at 30% 30%,
                    rgba(255,255,255,0.35),
                    transparent 60%
                ),
                radial-gradient(
                    circle at 70% 70%,
                    rgba(255,255,255,0.15),
                    transparent 60%
                );

            box-shadow:
                0 8px 14px rgba(0,0,0,0.20),
                0 0 0 2px rgba(0,0,0,0.05);

            flex-direction: column;
            align-items: center;
            transform-origin: center;
        }

        .team-card.visible {
            display: flex;
        }

        .team-card[data-team="tigers"] {
            transform: rotate(-1.5deg);
        }

        .team-card[data-team="giants"] {
            transform: rotate(1deg);
        }

        .team-card[data-team="lions"] {
            transform: rotate(-0.75deg);
        }

        .team-card[data-team="commanders"] {
            transform: rotate(1.25deg);
        }

        .team-card[data-team="michigan"] {
            transform: rotate(1.5deg);
        }

        .team-card[data-team="msu"] {
            transform: rotate(-1deg);
        }

        .team-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 0.4rem;
            border: 2px solid rgba(0,0,0,0.1);
            border-radius: 50%;
            overflow: hidden;
            background: white;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .team-league {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.10em;
            color: var(--muted);
        }

        .team-name {
            margin-bottom: 0.25rem;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
        }

        .game-line {
            width: 100%;
            min-height: 1.4em;
            margin-top: 0.25rem;
            padding: 0.3rem;
            border-radius: 6px;
            background: rgba(255,255,255,0.4);
            font-weight: 600;
            text-align: center;
        }

        .status-row {
            margin-top: 0.35rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
        }

        .status-pill {
            padding: 0.1rem 0.6rem;
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 999px;
            font-size: 0.75rem;
            letter-spacing: 0.10em;
            text-transform: uppercase;
        }

        .status-pill.live {
            color: var(--live);
            border-color: var(--live);
        }

        .status-pill.final {
            color: var(--final);
            border-color: var(--final);
        }

        .status-pill.scheduled {
            color: var(--scheduled);
            border-color: var(--scheduled);
        }


        /************************************************************
         * BASEBALL PREVIEW
         *
         * Functional representation only.
         * We will redesign this after backend approval.
         ************************************************************/

        .baseball-extra {
            display: none;
            width: 100%;
            margin-top: 0.75rem;
        }

        .team-card.baseball-live .baseball-extra {
            display: block;
        }

        .linescore {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.62rem;
        }

        .linescore th,
        .linescore td {
            padding: 2px;
            border: 1px solid rgba(0,0,0,0.15);
            text-align: center;
        }

        .linescore .team {
            text-align: left;
            font-weight: 700;
        }

        .baseball-situation {
            margin-top: 0.5rem;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .bases {
            position: relative;
            width: 60px;
            height: 42px;
            margin: 10px auto 0;
        }

        .base {
            position: absolute;
            width: 13px;
            height: 13px;
            background: rgba(255,255,255,0.7);
            border: 1px solid #777;
            transform: rotate(45deg);
        }

        .base.on {
            background: #e4b900;
        }

        .base.first {
            right: 5px;
            bottom: 2px;
        }

        .base.second {
            top: 0;
            left: 24px;
        }

        .base.third {
            left: 5px;
            bottom: 2px;
        }


        /************************************************************
         * FOOTBALL PREVIEW
         ************************************************************/

        .football-extra {
            display: none;
            width: 100%;
            margin-top: 0.65rem;
        }

        .team-card.football-live .football-extra {
            display: block;
        }

        .football-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .football-box {
            padding: 5px;
            border-radius: 4px;
            background: rgba(255,255,255,0.35);
            text-align: center;
            font-size: 0.7rem;
        }

        .football-label {
            display: block;
            margin-bottom: 2px;
            font-size: 0.55rem;
            color: var(--muted);
            text-transform: uppercase;
        }


        /************************************************************
         * PREVIEW INDICATOR
         ************************************************************/

        #preview-indicator {
            display: none;
            position: fixed;
            right: 8px;
            bottom: 8px;
            padding: 5px 8px;
            border-radius: 5px;
            background: #111;
            color: white;
            font-size: 10px;
            z-index: 999;
        }

        body.preview #preview-indicator {
            display: block;
        }


        /************************************************************
         * MESSAGE
         ************************************************************/

        #message {
            display: none;
            padding: 20px;
            color: #333;
            background: rgba(255,255,255,0.8);
            border-radius: 8px;
            text-align: center;
        }

        #message.visible {
            display: block;
        }
    </style>
</head>


<body>

    <div class="wrapper">

        <div class="scoreboard" id="scoreboard">


            <!-- TIGERS -->

            <div class="team-card" id="tigers-card" data-team="tigers">

                <div class="team-logo">
                    <img src="logos/tigers.png" alt="Detroit Tigers">
                </div>

                <div class="team-league">MLB</div>

                <div class="team-name">
                    Detroit Tigers
                </div>

                <div class="game-line" id="tigers-game"></div>

                <div class="status-row">

                    <span
                        class="status-pill"
                        id="tigers-status-pill">
                    </span>

                    <span
                        class="status-text"
                        id="tigers-status-text">
                    </span>

                </div>


                <div class="baseball-extra">

                    <div id="tigers-linescore"></div>

                    <div
                        class="baseball-situation"
                        id="tigers-baseball-situation">
                    </div>

                    <div class="bases">

                        <div
                            class="base first"
                            id="tigers-first">
                        </div>

                        <div
                            class="base second"
                            id="tigers-second">
                        </div>

                        <div
                            class="base third"
                            id="tigers-third">
                        </div>

                    </div>

                </div>

            </div>


            <!-- GIANTS -->

            <div class="team-card" id="giants-card" data-team="giants">

                <div class="team-logo">
                    <img src="logos/sfgiants.png" alt="San Francisco Giants">
                </div>

                <div class="team-league">MLB</div>

                <div class="team-name">
                    San Francisco Giants
                </div>

                <div class="game-line" id="giants-game"></div>

                <div class="status-row">

                    <span
                        class="status-pill"
                        id="giants-status-pill">
                    </span>

                    <span
                        class="status-text"
                        id="giants-status-text">
                    </span>

                </div>

            </div>


            <!-- LIONS -->

            <div class="team-card" id="lions-card" data-team="lions">

                <div class="team-logo">
                    <img src="logos/lions.png" alt="Detroit Lions">
                </div>

                <div class="team-league">NFL</div>

                <div class="team-name">
                    Detroit Lions
                </div>

                <div class="game-line" id="lions-game"></div>

                <div class="status-row">

                    <span
                        class="status-pill"
                        id="lions-status-pill">
                    </span>

                    <span
                        class="status-text"
                        id="lions-status-text">
                    </span>

                </div>


                <div class="football-extra">

                    <div class="football-grid">

                        <div class="football-box">
                            <span class="football-label">
                                Quarter
                            </span>
                            <span id="lions-quarter"></span>
                        </div>

                        <div class="football-box">
                            <span class="football-label">
                                Clock
                            </span>
                            <span id="lions-clock"></span>
                        </div>

                        <div class="football-box">
                            <span class="football-label">
                                Down
                            </span>
                            <span id="lions-down"></span>
                        </div>

                        <div class="football-box">
                            <span class="football-label">
                                Ball
                            </span>
                            <span id="lions-possession"></span>
                        </div>

                    </div>

                </div>

            </div>


            <!-- COMMANDERS -->

            <div class="team-card" id="commanders-card" data-team="commanders">

                <div class="team-logo">
                    <img src="logos/commanders.png" alt="Washington Commanders">
                </div>

                <div class="team-league">NFL</div>

                <div class="team-name">
                    Washington Commanders
                </div>

                <div class="game-line" id="commanders-game"></div>

                <div class="status-row">

                    <span
                        class="status-pill"
                        id="commanders-status-pill">
                    </span>

                    <span
                        class="status-text"
                        id="commanders-status-text">
                    </span>

                </div>

            </div>


            <!-- MICHIGAN -->

            <div class="team-card" id="michigan-card" data-team="michigan">

                <div class="team-logo">
                    <img src="logos/michigan.png" alt="Michigan Wolverines">
                </div>

                <div class="team-league">NCAA</div>

                <div class="team-name">
                    Michigan Wolverines
                </div>

                <div class="game-line" id="michigan-game"></div>

                <div class="status-row">

                    <span
                        class="status-pill"
                        id="michigan-status-pill">
                    </span>

                    <span
                        class="status-text"
                        id="michigan-status-text">
                    </span>

                </div>

            </div>


            <!-- MSU -->

            <div class="team-card" id="msu-card" data-team="msu">

                <div class="team-logo">
                    <img src="logos/msu.png" alt="Michigan State Spartans">
                </div>

                <div class="team-league">NCAA</div>

                <div class="team-name">
                    Michigan State Spartans
                </div>

                <div class="game-line" id="msu-game"></div>

                <div class="status-row">

                    <span
                        class="status-pill"
                        id="msu-status-pill">
                    </span>

                    <span
                        class="status-text"
                        id="msu-status-text">
                    </span>

                </div>

            </div>


            <div id="message"></div>

        </div>

    </div>


    <div id="preview-indicator">
        PREVIEW
    </div>


    <script>
        "use strict";


        /************************************************************
         ************************************************************
         *
         * CONFIGURATION
         *
         ************************************************************
         ************************************************************/

        const TEAMS = {
            tigers: {
                name: "Detroit Tigers",
                league: "MLB",
                sport: "baseball"
            },

            giants: {
                name: "San Francisco Giants",
                league: "MLB",
                sport: "baseball"
            },

            lions: {
                name: "Detroit Lions",
                league: "NFL",
                sport: "football"
            },

            commanders: {
                name: "Washington Commanders",
                league: "NFL",
                sport: "football"
            },

            michigan: {
                name: "Michigan Wolverines",
                league: "NCAA",
                sport: "football"
            },

            msu: {
                name: "Michigan State Spartans",
                league: "NCAA",
                sport: "football"
            }
        };


        /************************************************************
         * URL MODE
         ************************************************************/

        const PARAMS =
            new URLSearchParams(
                window.location.search
            );

        const PREVIEW =
            (
                PARAMS.get("preview") ||
                ""
            ).toLowerCase();


        /************************************************************
         ************************************************************
         *
         * BASIC HELPERS
         *
         ************************************************************
         ************************************************************/

        function get(id) {
            return document.getElementById(id);
        }


        function showCard(team) {
            const card = get(team + "-card");

            if (card) {
                card.classList.add("visible");
            }
        }


        function hideCard(team) {
            const card = get(team + "-card");

            if (card) {
                card.classList.remove("visible");
            }
        }


        function hideAllCards() {
            Object.keys(TEAMS).forEach(
                function(team) {
                    hideCard(team);
                }
            );
        }


        function setText(id, text) {
            const element = get(id);

            if (element) {
                element.textContent =
                    text == null
                        ? ""
                        : String(text);
            }
        }


        function setStatus(team, type, text) {
            const pill =
                get(team + "-status-pill");

            if (!pill) {
                return;
            }

            pill.textContent = text;

            pill.className =
                "status-pill " + type;
        }


        function setBase(id, occupied) {
            const base = get(id);

            if (!base) {
                return;
            }

            if (occupied) {
                base.classList.add("on");
            }
            else {
                base.classList.remove("on");
            }
        }


        /************************************************************
         ************************************************************
         *
         * GENERIC STICKY CARD
         *
         ************************************************************
         ************************************************************/

        function renderScheduled(
            team,
            away,
            home,
            dateText
        ) {
            showCard(team);

            setText(
                team + "-game",
                away + " @ " + home
            );

            setStatus(
                team,
                "scheduled",
                "Scheduled"
            );

            setText(
                team + "-status-text",
                dateText
            );
        }


        /************************************************************
         ************************************************************
         *
         * BASEBALL PREVIEW
         *
         ************************************************************
         ************************************************************/

        function renderBaseballPreview() {
            const team = "tigers";

            showCard(team);

            const card =
                get(team + "-card");

            card.classList.add(
                "baseball-live"
            );

            setText(
                team + "-game",
                "CLE 2 @ DET 4"
            );

            setStatus(
                team,
                "live",
                "Live"
            );

            setText(
                team + "-status-text",
                "Bottom 6th"
            );


            const innings = [
                "1",
                "2",
                "3",
                "4",
                "5",
                "6",
                "7",
                "8",
                "9"
            ];


            const cle = [
                0,
                0,
                1,
                0,
                1,
                0,
                "",
                "",
                ""
            ];


            const det = [
                1,
                0,
                0,
                2,
                0,
                1,
                "",
                "",
                ""
            ];


            let html =
                '<table class="linescore">' +
                '<thead>' +
                '<tr>' +
                '<th class="team">TEAM</th>';


            innings.forEach(
                function(inning) {
                    html +=
                        "<th>" +
                        inning +
                        "</th>";
                }
            );


            html +=
                "<th>R</th>" +
                "<th>H</th>" +
                "<th>E</th>" +
                "</tr>" +
                "</thead>" +
                "<tbody>";


            html +=
                '<tr>' +
                '<td class="team">CLE</td>';


            cle.forEach(
                function(score) {
                    html +=
                        "<td>" +
                        score +
                        "</td>";
                }
            );


            html +=
                "<td>2</td>" +
                "<td>5</td>" +
                "<td>0</td>" +
                "</tr>";


            html +=
                '<tr>' +
                '<td class="team">DET</td>';


            det.forEach(
                function(score) {
                    html +=
                        "<td>" +
                        score +
                        "</td>";
                }
            );


            html +=
                "<td>4</td>" +
                "<td>7</td>" +
                "<td>1</td>" +
                "</tr>" +
                "</tbody>" +
                "</table>";


            get(
                team + "-linescore"
            ).innerHTML = html;


            setText(
                team + "-baseball-situation",
                "B:2  S:1  O:1"
            );


            setBase(
                team + "-first",
                true
            );

            setBase(
                team + "-second",
                false
            );

            setBase(
                team + "-third",
                true
            );
        }


        /************************************************************
         ************************************************************
         *
         * FOOTBALL PREVIEW
         *
         ************************************************************
         ************************************************************/

        function renderFootballPreview() {
            const team = "lions";

            showCard(team);

            const card =
                get(team + "-card");

            card.classList.add(
                "football-live"
            );

            setText(
                team + "-game",
                "GB 14 @ DET 17"
            );

            setStatus(
                team,
                "live",
                "Live"
            );

            setText(
                team + "-status-text",
                "3rd Quarter"
            );

            setText(
                team + "-quarter",
                "Q3"
            );

            setText(
                team + "-clock",
                "8:42"
            );

            setText(
                team + "-down",
                "2nd & 6"
            );

            setText(
                team + "-possession",
                "DET 38"
            );
        }


        /************************************************************
         ************************************************************
         *
         * STICKY PREVIEW
         *
         ************************************************************
         ************************************************************/

        function renderStickyPreview() {
            renderScheduled(
                "tigers",
                "CLE",
                "DET",
                "Tonight • 7:10 PM"
            );

            renderScheduled(
                "giants",
                "SF",
                "LAD",
                "Tonight • 10:10 PM"
            );

            renderScheduled(
                "lions",
                "DET",
                "CHI",
                "Sunday • 1:00 PM"
            );

            renderScheduled(
                "commanders",
                "WSH",
                "DAL",
                "Sunday • 4:25 PM"
            );

            renderScheduled(
                "michigan",
                "MICH",
                "WIS",
                "Saturday • 12:00 PM"
            );

            renderScheduled(
                "msu",
                "MSU",
                "IOWA",
                "Saturday • 3:30 PM"
            );
        }


        /************************************************************
         ************************************************************
         *
         * STARTUP
         *
         ************************************************************
         ************************************************************/

        function start() {
            hideAllCards();

            if (PREVIEW) {
                document.body.classList.add(
                    "preview"
                );
            }


            if (PREVIEW === "baseball") {
                renderBaseballPreview();
                return;
            }


            if (PREVIEW === "football") {
                renderFootballPreview();
                return;
            }


            if (PREVIEW === "sticky") {
                renderStickyPreview();
                return;
            }


            /*
             * IMPORTANT:
             *
             * Production intentionally does nothing in this
             * validation build.
             *
             * There is NO ESPN request yet.
             *
             * A blank normal URL is therefore EXPECTED during
             * this specific test.
             */

            const message =
                get("message");

            message.textContent =
                "Preview validation build";

            message.classList.add(
                "visible"
            );
        }


        start();

    </script>

</body>
</html>
