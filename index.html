<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Sports Board</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-store, no-cache, must-revalidate, max-age=0"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >


    <style>

        /************************************************************
         ************************************************************
         *
         * BASE
         *
         ************************************************************
         ************************************************************/

        :root
        {
            --text: #151515;
            --muted: #666666;

            --scheduled: #2458a6;
            --live: #b00000;
            --final: #187037;

            --border: rgba(0, 0, 0, 0.15);

            --sticky-yellow: #fff4a8;
            --sticky-blue: #dcefff;
            --sticky-green: #dcf5df;
            --sticky-red: #ffe1df;
        }


        *
        {
            box-sizing: border-box;
        }


        html,
        body
        {
            width: 100%;
            min-height: 100%;

            margin: 0;
            padding: 0;

            background: transparent !important;

            overflow: hidden;

            color: var(--text);

            font-family:
                "Segoe UI",
                Arial,
                Helvetica,
                sans-serif;
        }


        body
        {
            padding: 16px;
        }


        /************************************************************
         *
         * BOARD
         *
         ************************************************************/

        #sports-board
        {
            width: 100%;

            display: flex;

            flex-wrap: wrap;

            justify-content: center;
            align-items: flex-start;

            gap: 20px;
        }


        /************************************************************
         ************************************************************
         *
         * GAME CARD
         *
         * Graphics are intentionally restrained right now.
         *
         ************************************************************
         ************************************************************/

        .game-card
        {
            display: none;

            position: relative;

            width: 270px;

            padding: 18px;

            border-radius: 8px;

            background: var(--sticky-yellow);

            box-shadow:
                0 7px 15px rgba(0,0,0,0.18);

            transform-origin: center;
        }


        .game-card.visible
        {
            display: block;
        }


        .game-card[data-team="tigers"]
        {
            background: var(--sticky-yellow);
            transform: rotate(-1.2deg);
        }


        .game-card[data-team="giants"]
        {
            background: var(--sticky-red);
            transform: rotate(1deg);
        }


        .game-card[data-team="lions"]
        {
            background: var(--sticky-blue);
            transform: rotate(-0.8deg);
        }


        .game-card[data-team="commanders"]
        {
            background: #f5dfcf;
            transform: rotate(1.3deg);
        }


        .game-card[data-team="michigan"]
        {
            background: #fff2b8;
            transform: rotate(-1deg);
        }


        .game-card[data-team="msu"]
        {
            background: var(--sticky-green);
            transform: rotate(0.8deg);
        }


        /************************************************************
         *
         * HEADER
         *
         ************************************************************/

        .game-header
        {
            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 12px;
        }


        .team-info
        {
            display: flex;

            align-items: center;

            gap: 10px;
        }


        .team-logo
        {
            width: 54px;
            height: 54px;

            border-radius: 50%;

            background: white;

            object-fit: contain;
        }


        .team-name
        {
            font-size: 15px;
            font-weight: 700;
        }


        .league
        {
            margin-top: 2px;

            font-size: 11px;

            color: var(--muted);

            text-transform: uppercase;
        }


        /************************************************************
         *
         * STATUS
         *
         ************************************************************/

        .status
        {
            padding:
                3px
                7px;

            border:
                1px solid
                currentColor;

            border-radius:
                999px;

            font-size:
                10px;

            font-weight:
                700;

            text-transform:
                uppercase;
        }


        .status.pre
        {
            color:
                var(--scheduled);
        }


        .status.live
        {
            color:
                var(--live);
        }


        .status.final
        {
            color:
                var(--final);
        }


        /************************************************************
         *
         * MATCHUP
         *
         ************************************************************/

        .matchup
        {
            margin-top:
                14px;

            padding:
                9px;

            border-radius:
                5px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.45
                );

            font-size:
                20px;

            font-weight:
                700;

            text-align:
                center;
        }


        .game-detail
        {
            min-height:
                18px;

            margin-top:
                6px;

            color:
                var(--muted);

            font-size:
                12px;

            text-align:
                center;
        }


        /************************************************************
         ************************************************************
         *
         * LIVE DATA PANELS
         *
         ************************************************************
         ************************************************************/

        .sport-panel
        {
            display: none;

            margin-top:
                14px;
        }


        .sport-panel.visible
        {
            display: block;
        }


        /************************************************************
         *
         * BASEBALL LINE SCORE
         *
         ************************************************************/

        .line-score-container
        {
            width:
                100%;

            overflow:
                hidden;
        }


        .line-score
        {
            width:
                100%;

            border-collapse:
                collapse;

            font-size:
                10px;
        }


        .line-score th,
        .line-score td
        {
            padding:
                3px;

            border:
                1px solid
                rgba(
                    0,
                    0,
                    0,
                    0.15
                );

            text-align:
                center;
        }


        .line-score .team-column
        {
            text-align:
                left;

            font-weight:
                700;
        }


        /************************************************************
         *
         * DATA GRID
         *
         ************************************************************/

        .data-grid
        {
            display:
                grid;

            grid-template-columns:
                repeat(
                    2,
                    minmax(
                        0,
                        1fr
                    )
                );

            gap:
                7px;

            margin-top:
                10px;
        }


        .data-box
        {
            padding:
                7px;

            border:
                1px solid
                var(--border);

            border-radius:
                4px;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.3
                );

            text-align:
                center;
        }


        .data-label
        {
            display:
                block;

            margin-bottom:
                3px;

            color:
                var(--muted);

            font-size:
                9px;

            text-transform:
                uppercase;
        }


        /************************************************************
         *
         * BASES
         *
         ************************************************************/

        .base-diamond
        {
            position:
                relative;

            width:
                72px;

            height:
                55px;

            margin:
                14px auto 2px;
        }


        .base
        {
            position:
                absolute;

            width:
                16px;

            height:
                16px;

            border:
                2px solid
                #777;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.6
                );

            transform:
                rotate(45deg);
        }


        .base.on
        {
            background:
                #e2b500;

            border-color:
                #8f7100;
        }


        .base.first
        {
            right:
                7px;

            bottom:
                4px;
        }


        .base.second
        {
            left:
                28px;

            top:
                0;
        }


        .base.third
        {
            left:
                7px;

            bottom:
                4px;
        }


        /************************************************************
         *
         * DEBUG
         *
         ************************************************************/

        #debug-panel
        {
            display:
                none;

            width:
                100%;

            margin-top:
                20px;

            padding:
                16px;

            background:
                #111;

            color:
                #eee;

            overflow:
                auto;

            white-space:
                pre-wrap;

            font-family:
                monospace;

            font-size:
                11px;
        }


        body.debug
        {
            overflow:
                auto;
        }


        body.debug #debug-panel
        {
            display:
                block;
        }


        /************************************************************
         *
         * PREVIEW NOTICE
         *
         ************************************************************/

        #preview-notice
        {
            display:
                none;

            position:
                fixed;

            right:
                8px;

            bottom:
                8px;

            z-index:
                999;

            padding:
                6px
                9px;

            border-radius:
                5px;

            background:
                #111;

            color:
                white;

            font-size:
                10px;
        }


        body.preview
        #preview-notice
        {
            display:
                block;
        }

    </style>
</head>


<body>

    <main id="sports-board"></main>

    <pre id="debug-panel"></pre>

    <div id="preview-notice">
        PREVIEW DATA
    </div>


    <script>

        "use strict";


        /************************************************************
         ************************************************************
         *
         * URL OPTIONS
         *
         ************************************************************
         ************************************************************/

        const URL_OPTIONS =
            new URLSearchParams(
                window.location.search
            );


        const DEBUG =
            URL_OPTIONS.get(
                "debug"
            ) === "1";


        const PREVIEW =
            (
                URL_OPTIONS.get(
                    "preview"
                ) || ""
            ).toLowerCase();


        /************************************************************
         ************************************************************
         *
         * CONFIGURATION
         *
         ************************************************************
         ************************************************************/

        const CONFIG =
        {
            refresh:
            {
                normal:
                    60000,

                live:
                    30000
            },

            football:
            {
                /*
                 * Tuesday.
                 *
                 * JS:
                 *
                 * Sunday = 0
                 * Monday = 1
                 * Tuesday = 2
                 */

                weekStart:
                    2
            }
        };


        /************************************************************
         ************************************************************
         *
         * TEAMS
         *
         ************************************************************
         ************************************************************/

        const TEAMS =
        {
            tigers:
            {
                id:
                    "tigers",

                name:
                    "Detroit Tigers",

                abbreviation:
                    "DET",

                league:
                    "MLB",

                source:
                    "mlb",

                sport:
                    "baseball",

                logo:
                    "logos/tigers.png"
            },


            giants:
            {
                id:
                    "giants",

                name:
                    "San Francisco Giants",

                abbreviation:
                    "SF",

                league:
                    "MLB",

                source:
                    "mlb",

                sport:
                    "baseball",

                logo:
                    "logos/sfgiants.png"
            },


            lions:
            {
                id:
                    "lions",

                name:
                    "Detroit Lions",

                abbreviation:
                    "DET",

                league:
                    "NFL",

                source:
                    "nfl",

                sport:
                    "football",

                logo:
                    "logos/lions.png"
            },


            commanders:
            {
                id:
                    "commanders",

                name:
                    "Washington Commanders",

                abbreviation:
                    "WSH",

                league:
                    "NFL",

                source:
                    "nfl",

                sport:
                    "football",

                logo:
                    "logos/commanders.png"
            },


            michigan:
            {
                id:
                    "michigan",

                name:
                    "Michigan Wolverines",

                abbreviation:
                    "MICH",

                league:
                    "NCAA",

                source:
                    "cfb",

                sport:
                    "football",

                logo:
                    "logos/michigan.png"
            },


            msu:
            {
                id:
                    "msu",

                name:
                    "Michigan State Spartans",

                abbreviation:
                    "MSU",

                league:
                    "NCAA",

                source:
                    "cfb",

                sport:
                    "football",

                logo:
                    "logos/msu.png"
            }
        };


        /************************************************************
         ************************************************************
         *
         * ESPN
         *
         ************************************************************
         ************************************************************/

        const ESPN =
        {
            mlb:
                "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard",

            nfl:
                "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",

            cfb:
                "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard"
        };


        /************************************************************
         ************************************************************
         *
         * STATE
         *
         ************************************************************
         ************************************************************/

        const STATE =
        {
            games:
                {},

            rendered:
                {},

            lastGood:
            {
                mlb:
                    null,

                nfl:
                    null,

                cfb:
                    null
            },

            refreshing:
                false,

            timer:
                null,

            lastRefresh:
                null
        };


        /************************************************************
         ************************************************************
         *
         * DATE ENGINE
         *
         ************************************************************
         ************************************************************/

        function startOfToday()
        {
            const now =
                new Date();

            return new Date(
                now.getFullYear(),
                now.getMonth(),
                now.getDate()
            );
        }


        function pad2(value)
        {
            return String(
                value
            ).padStart(
                2,
                "0"
            );
        }


        function espnDate(date)
        {
            return (
                date.getFullYear() +
                pad2(
                    date.getMonth() + 1
                ) +
                pad2(
                    date.getDate()
                )
            );
        }


        function getFootballWeek()
        {
            const today =
                startOfToday();

            const currentDay =
                today.getDay();

            const difference =
                (
                    currentDay -
                    CONFIG.football.weekStart +
                    7
                ) % 7;


            const start =
                new Date(
                    today
                );

            start.setDate(
                start.getDate() -
                difference
            );


            const end =
                new Date(
                    start
                );

            end.setDate(
                end.getDate() +
                6
            );


            return
            {
                start,
                end
            };
        }


        function formatGameDate(
            value
        )
        {
            if (!value)
            {
                return "";
            }


            return new Date(
                value
            ).toLocaleString(
                [],
                {
                    weekday:
                        "short",

                    month:
                        "short",

                    day:
                        "numeric",

                    hour:
                        "numeric",

                    minute:
                        "2-digit"
                }
            );
        }


        /************************************************************
         ************************************************************
         *
         * URL BUILDING
         *
         ************************************************************
         ************************************************************/

        function buildMLBURL()
        {
            return (
                ESPN.mlb +
                "?dates=" +
                espnDate(
                    startOfToday()
                )
            );
        }


        function buildNFLURL()
        {
            const week =
                getFootballWeek();


            return (
                ESPN.nfl +
                "?dates=" +
                espnDate(
                    week.start
                ) +
                "-" +
                espnDate(
                    week.end
                )
            );
        }


        function buildCFBURL()
        {
            const week =
                getFootballWeek();


            return (
                ESPN.cfb +
                "?groups=80" +
                "&limit=1000" +
                "&dates=" +
                espnDate(
                    week.start
                ) +
                "-" +
                espnDate(
                    week.end
                )
            );
        }


        /************************************************************
         ************************************************************
         *
         * NETWORK
         *
         ************************************************************
         ************************************************************/

        async function fetchJSON(
            url
        )
        {
            const separator =
                url.includes("?")
                    ? "&"
                    : "?";


            const cacheBusted =
                url +
                separator +
                "_=" +
                Date.now();


            const response =
                await fetch(
                    cacheBusted,
                    {
                        cache:
                            "no-store"
                    }
                );


            if (!response.ok)
            {
                throw new Error(
                    "HTTP " +
                    response.status
                );
            }


            return response.json();
        }


        /************************************************************
         ************************************************************
         *
         * ESPN EVENT SELECTION
         *
         ************************************************************
         ************************************************************/

        function competitionOf(
            event
        )
        {
            return (
                event
                    ?.competitions
                    ?.[0] ||
                null
            );
        }


        function competitorsOf(
            event
        )
        {
            return (
                competitionOf(
                    event
                )
                    ?.competitors ||
                []
            );
        }


        function hasTeam(
            event,
            abbreviation
        )
        {
            return competitorsOf(
                event
            ).some(
                competitor =>
                    competitor
                        ?.team
                        ?.abbreviation ===
                    abbreviation
            );
        }


        function selectEvent(
            events,
            abbreviation
        )
        {
            if (
                !Array.isArray(
                    events
                )
            )
            {
                return null;
            }


            const games =
                events
                    .filter(
                        event =>
                            hasTeam(
                                event,
                                abbreviation
                            )
                    )
                    .sort(
                        (
                            a,
                            b
                        ) =>
                            new Date(
                                a.date
                            ) -
                            new Date(
                                b.date
                            )
                    );


            if (
                games.length ===
                0
            )
            {
                return null;
            }


            /*
             * LIVE always wins.
             */

            const live =
                games.find(
                    game =>
                        game
                            ?.status
                            ?.type
                            ?.state ===
                        "in"
                );


            if (live)
            {
                return live;
            }


            /*
             * Then an upcoming game.
             */

            const upcoming =
                games.find(
                    game =>
                        game
                            ?.status
                            ?.type
                            ?.state ===
                        "pre"
                );


            if (upcoming)
            {
                return upcoming;
            }


            /*
             * Otherwise most recent final.
             */

            return games[
                games.length -
                1
            ];
        }


        /************************************************************
         ************************************************************
         *
         * COMMON NORMALIZATION
         *
         ************************************************************
         ************************************************************/

        function normalizeTeam(
            competitor
        )
        {
            if (!competitor)
            {
                return null;
            }


            return
            {
                id:
                    String(
                        competitor
                            ?.team
                            ?.id ||
                        ""
                    ),

                abbreviation:
                    competitor
                        ?.team
                        ?.abbreviation ||
                    "",

                name:
                    competitor
                        ?.team
                        ?.displayName ||
                    "",

                shortName:
                    competitor
                        ?.team
                        ?.shortDisplayName ||
                    "",

                score:
                    Number(
                        competitor
                            ?.score ||
                        0
                    ),

                homeAway:
                    competitor
                        ?.homeAway ||
                    "",

                record:
                    competitor
                        ?.records
                        ?.[0]
                        ?.summary ||
                    "",

                winner:
                    competitor
                        ?.winner ===
                    true
            };
        }


        function normalizeStatus(
            event
        )
        {
            const status =
                event?.status || {};

            const type =
                status?.type || {};


            return
            {
                state:
                    type.state ||
                    "pre",

                completed:
                    type.completed ===
                    true,

                description:
                    type.description ||
                    "",

                detail:
                    type.detail ||
                    "",

                shortDetail:
                    type.shortDetail ||
                    "",

                period:
                    status.period ??
                    null,

                clock:
                    status.displayClock ||
                    ""
            };
        }


        function normalizeBroadcasts(
            competition
        )
        {
            const result =
                [];


            (
                competition
                    ?.broadcasts ||
                []
            ).forEach(
                broadcast =>
                {
                    (
                        broadcast.names ||
                        []
                    ).forEach(
                        name =>
                        {
                            if (
                                !result.includes(
                                    name
                                )
                            )
                            {
                                result.push(
                                    name
                                );
                            }
                        }
                    );
                }
            );


            return result;
        }


        /************************************************************
         ************************************************************
         *
         * BASEBALL NORMALIZATION
         *
         ************************************************************
         ************************************************************/

        function baseballLine(
            competitor
        )
        {
            return (
                competitor
                    ?.linescores ||
                []
            ).map(
                (
                    inning,
                    index
                ) =>
                ({
                    inning:
                        index + 1,

                    runs:
                        inning?.value ??
                        null
                })
            );
        }


        function findStatistic(
            competitor,
            names
        )
        {
            const stats =
                competitor
                    ?.statistics ||
                [];


            for (
                const name
                of names
            )
            {
                const match =
                    stats.find(
                        stat =>
                            stat?.name ===
                                name ||
                            stat?.abbreviation ===
                                name
                    );


                if (match)
                {
                    return (
                        match.displayValue ??
                        match.value ??
                        null
                    );
                }
            }


            return null;
        }


        function baseballTotals(
            competitor
        )
        {
            return
            {
                runs:
                    Number(
                        competitor
                            ?.score ||
                        0
                    ),

                hits:
                    findStatistic(
                        competitor,
                        [
                            "hits",
                            "H"
                        ]
                    ),

                errors:
                    findStatistic(
                        competitor,
                        [
                            "errors",
                            "E"
                        ]
                    )
            };
        }


        function normalizeBaseball(
            event
        )
        {
            const competition =
                competitionOf(
                    event
                );


            if (!competition)
            {
                return null;
            }


            const competitors =
                competition.competitors ||
                [];


            const homeRaw =
                competitors.find(
                    competitor =>
                        competitor.homeAway ===
                        "home"
                );


            const awayRaw =
                competitors.find(
                    competitor =>
                        competitor.homeAway ===
                        "away"
                );


            const situation =
                competition.situation ||
                {};


            return
            {
                id:
                    event.id,

                sport:
                    "baseball",

                league:
                    "MLB",

                date:
                    event.date,

                name:
                    event.name ||
                    "",

                status:
                    normalizeStatus(
                        event
                    ),

                home:
                    normalizeTeam(
                        homeRaw
                    ),

                away:
                    normalizeTeam(
                        awayRaw
                    ),

                venue:
                    competition
                        ?.venue
                        ?.fullName ||
                    "",

                broadcasts:
                    normalizeBroadcasts(
                        competition
                    ),

                linescore:
                {
                    away:
                        baseballLine(
                            awayRaw
                        ),

                    home:
                        baseballLine(
                            homeRaw
                        )
                },

                totals:
                {
                    away:
                        baseballTotals(
                            awayRaw
                        ),

                    home:
                        baseballTotals(
                            homeRaw
                        )
                },

                situation:
                {
                    inning:
                        situation.inning ??
                        null,

                    inningHalf:
                        situation.inningHalf ||
                        "",

                    isTop:
                        situation.isTopInning ??
                        null,

                    balls:
                        situation.balls ??
                        null,

                    strikes:
                        situation.strikes ??
                        null,

                    outs:
                        situation.outs ??
                        null,

                    onFirst:
                        situation.onFirst ===
                        true,

                    onSecond:
                        situation.onSecond ===
                        true,

                    onThird:
                        situation.onThird ===
                        true,

                    batter:
                        situation.batter ||
                        null,

                    pitcher:
                        situation.pitcher ||
                        null
                }
            };
        }


        /************************************************************
         ************************************************************
         *
         * FOOTBALL NORMALIZATION
         *
         ************************************************************
         ************************************************************/

        function footballLine(
            competitor
        )
        {
            return (
                competitor
                    ?.linescores ||
                []
            ).map(
                (
                    quarter,
                    index
                ) =>
                ({
                    period:
                        index + 1,

                    points:
                        quarter?.value ??
                        null
                })
            );
        }


        function normalizeFootball(
            event,
            league
        )
        {
            const competition =
                competitionOf(
                    event
                );


            if (!competition)
            {
                return null;
            }


            const competitors =
                competition.competitors ||
                [];


            const homeRaw =
                competitors.find(
                    competitor =>
                        competitor.homeAway ===
                        "home"
                );


            const awayRaw =
                competitors.find(
                    competitor =>
                        competitor.homeAway ===
                        "away"
                );


            const situation =
                competition.situation ||
                {};


            return
            {
                id:
                    event.id,

                sport:
                    "football",

                league,

                date:
                    event.date,

                name:
                    event.name ||
                    "",

                status:
                    normalizeStatus(
                        event
                    ),

                home:
                    normalizeTeam(
                        homeRaw
                    ),

                away:
                    normalizeTeam(
                        awayRaw
                    ),

                venue:
                    competition
                        ?.venue
                        ?.fullName ||
                    "",

                broadcasts:
                    normalizeBroadcasts(
                        competition
                    ),

                quarterScores:
                {
                    away:
                        footballLine(
                            awayRaw
                        ),

                    home:
                        footballLine(
                            homeRaw
                        )
                },

                situation:
                {
                    down:
                        situation.down ??
                        null,

                    distance:
                        situation.distance ??
                        null,

                    yardLine:
                        situation.yardLine ??
                        null,

                    territory:
                        situation.yardLineTerritory ||
                        "",

                    possession:
                        String(
                            situation.possession ||
                            ""
                        ),

                    redZone:
                        situation.isRedZone ===
                        true,

                    shortText:
                        situation.shortDownDistanceText ||
                        "",

                    text:
                        situation.downDistanceText ||
                        ""
                }
            };
        }

         *
         * GAME PROCESSING
         *
         ************************************************************
         ************************************************************/

        function processTeam(
            team,
            data
        )
        {
            const event =
                selectEvent(
                    data?.events,
                    team.abbreviation
                );


            if (!event)
            {
                return null;
            }


            if (
                team.sport ===
                "baseball"
            )
            {
                return normalizeBaseball(
                    event
                );
            }


            return normalizeFootball(
                event,
                team.league
            );
        }

        function setText(

        {

            if (element)
            {
                element.textContent =

        function renderTeam(
            team,
            game
        )
        {
            const card =
                document.getElementById(
                    `${team.id}-card`
                );


            if (!card)
            {
                return;
            }


            STATE.games[
                team.id
            ] = game;


            if (!game)
            {
                card.classList.remove(
                    "visible"
                );


                delete STATE.rendered[
                    team.id
                ];


                return;
            }


            const signature =
                JSON.stringify(
                    game
                );


            if (
                STATE.rendered[
                    team.id
                ] ===
                signature
            )
            {
                return;
            }


            STATE.rendered[
                team.id
            ] = signature;


            card.classList.add(
                "visible"
            );


            renderCommon(
                team,
                game
            );


            if (
                game.sport ===
                "baseball"
            )
            {
                renderBaseball(
                    team,
                    game
                );
            }
            else
            {
                renderFootball(
                    team,
                    game
                );
            }
        }


        function renderCommon(
            team,
            game
        )
        {
            const state =
                game.status.state;


            const status =
                document.getElementById(
                    `${team.id}-status`
                );


            if (
                state ===
                "in"
            )
            {
                status.textContent =
                    "LIVE";

                status.className =
                    "status live";
            }
            else if (
                state ===
                "post"
            )
            {
                status.textContent =
                    "FINAL";

                status.className =
                    "status final";
            }
            else
            {
                status.textContent =
                    "SCHEDULED";

                status.className =
                    "status pre";
            }


            setText(
                `${team.id}-matchup`,

                `${game.away.abbreviation} ` +
                `${game.away.score} @ ` +
                `${game.home.abbreviation} ` +
                `${game.home.score}`
            );


            if (
                state ===
                "pre"
            )
            {
                setText(
                    `${team.id}-detail`,
                    formatGameDate(
                        game.date
                    )
                );
            }
            else
            {
                setText(
                    `${team.id}-detail`,

                    game.status.shortDetail ||
                    game.status.detail ||
                    ""
                );
            }
        }

        function renderBaseball(
            team,
            game
        )
        {
            document
                .getElementById(
                    `${team.id}-baseball`
                )
                .classList.add(
                    "visible"
                );


            document
                .getElementById(
                    `${team.id}-football`
                )
                .classList.remove(
                    "visible"
                );


            renderLineScore(
                team,
                game
            );


            const situation =
                game.situation;


            let inning =
                "";


            if (
                situation.inning !=
                null
            )
            {
                let half =
                    situation.inningHalf;


                if (!half)
                {
                    if (
                        situation.isTop ===
                        true
                    )
                    {
                        half =
                            "Top";
                    }
                    else if (
                        situation.isTop ===
                        false
                    )
                    {
                        half =
                            "Bottom";
                    }
                }


                inning =
                    `${half || ""} ` +
                    `${situation.inning}`;
            }


            setText(
                `${team.id}-inning`,
                inning.trim()
            );


            setText(
                `${team.id}-count`,

                (
                    situation.balls !=
                        null &&
                    situation.strikes !=
                        null
                )
                    ? `${situation.balls}-${situation.strikes}`
                    : ""
            );


            setText(
                `${team.id}-outs`,
                situation.outs
            );


            setText(
                `${team.id}-baseball-broadcast`,
                game.broadcasts.join(
                    ", "
                )
            );


            setBase(
                `${team.id}-first`,
                situation.onFirst
            );


            setBase(
                `${team.id}-second`,
                situation.onSecond
            );


            setBase(
                `${team.id}-third`,
                situation.onThird
            );
        }

        )
        {

        function renderLineScore(
            team,
            game
        )
        {
            const target =
                document.getElementById(
                    `${team.id}-linescore`
                );


            const innings =
                Math.max(
                    9,

                    game.linescore.away.length,

                    game.linescore.home.length
                );


            let inningHeaders =
                "";


            for (
                let inning = 1;
                inning <= innings;
                inning++
            )
            {
                inningHeaders +=
                    `<th>${inning}</th>`;
            }


            function row(
                competitor,
                scores,
                totals
            )
            {
                let cells =
                    "";


                for (
                    let index = 0;
                    index < innings;
                    index++
                )
                {
                    const value =
                        scores[
                            index
                        ]?.runs;


                    cells +=
                        `<td>${
                            value == null
                                ? ""
                                : value
                        }</td>`;
                }


                return `
                    <tr>

                        <th class="team-column">
                            ${competitor.abbreviation}
                        </th>

                        ${cells}

                        <td>
                            ${totals.runs ?? ""}
                        </td>

                        <td>
                            ${totals.hits ?? ""}
                        </td>

                        <td>
                            ${totals.errors ?? ""}
                        </td>

                    </tr>
                `;
            }


            target.innerHTML =
            `
                <table class="line-score">

                    <thead>

                        <tr>

                            <th class="team-column">
                                TEAM
                            </th>

                            ${inningHeaders}

                            <th>R</th>
                            <th>H</th>
                            <th>E</th>

                        </tr>

                    </thead>


                    <tbody>

                        ${row(
                            game.away,
                            game.linescore.away,
                            game.totals.away
                        )}

                        ${row(
                            game.home,
                            game.linescore.home,
                            game.totals.home
                        )}

                    </tbody>

                </table>
            `;
        }


        /************************************************************
         ************************************************************
         *
         * FOOTBALL RENDERING
         *
         ************************************************************
         ************************************************************/

        function renderFootball(
            team,
            game
        )
        {
            document
                .getElementById(
                    `${team.id}-football`
                )
                .classList.add(
                    "visible"
                );


            document
                .getElementById(
                    `${team.id}-baseball`
                )
                .classList.remove(
                    "visible"
                );


            setText(
                `${team.id}-quarter`,

                game.status.period
                    ? `Q${game.status.period}`
                    : ""
            );


            setText(
                `${team.id}-clock`,
                game.status.clock
            );


            let down =
                "";


            if (
                game.situation.down !=
                    null &&
                game.situation.distance !=
                    null
            )
            {
                const ordinal =
                    {
                        1:
                            "1st",

                        2:
                            "2nd",

                        3:
                            "3rd",

                        4:
                            "4th"
                    }[
                        game.situation.down
                    ] ||
                    game.situation.down;


                down =
                    `${ordinal} & ` +
                    `${game.situation.distance}`;
            }


            setText(
                `${team.id}-down`,
                down
            );


            setText(
                `${team.id}-possession`,
                resolvePossession(
                    game
                )
            );


            let field =
                "";


            if (
                game.situation.territory &&
                game.situation.yardLine !=
                    null
            )
            {
                field =
                    `${game.situation.territory} ` +
                    `${game.situation.yardLine}`;
            }


            if (
                game.situation.redZone
            )
            {
                field +=
                    field
                        ? " • RED ZONE"
                        : "RED ZONE";
            }


            setText(
                `${team.id}-field`,
                field
            );


            setText(
                `${team.id}-football-broadcast`,
                game.broadcasts.join(
                    ", "
                )
            );
        }


        function resolvePossession(
            game
        )
        {
            const possession =
                game.situation.possession;


            if (!possession)
            {
                return "";
            }


            if (
                possession ===
                game.home.id
            )
            {
                return (
                    game.home.abbreviation +
                    " BALL"
                );
            }


            if (
                possession ===
                game.away.id
            )
            {
                return (
                    game.away.abbreviation +
                    " BALL"
                );
            }


            return possession;
        }

            if (

                "football"
            )
            {
                renderTeam(
                    TEAMS.lions,
                    previewFootballGame()
                );

                return;

            if (
                PREVIEW ===
                "sticky"
            )
            {

                        renderTeam(
                            team,
                            previewScheduledGame(
                                team
                            )
                        );
                    }
                );

                return;
            }
        }


        /************************************************************
         ************************************************************
         *
         * REFRESH ENGINE
         *
         ************************************************************
         ************************************************************/

        async function refreshScores()
        {
            if (
                STATE.refreshing ||
                PREVIEW
            )
            {
                return;
            }


            STATE.refreshing =
                true;


            try
            {
                const results =
                    await Promise.allSettled(
                        [
                            fetchJSON(
                                buildMLBURL()
                            ),

                            fetchJSON(
                                buildNFLURL()
                            ),

                            fetchJSON(
                                buildCFBURL()
                            )
                        ]
                    );


                const mlb =
                    results[0];

                const nfl =
                    results[1];

                const cfb =
                    results[2];


                /****************************************************
                 *
                 * MLB
                 *
                 ****************************************************/

                if (
                    mlb.status ===
                    "fulfilled"
                )
                {
                    STATE.lastGood.mlb =
                        mlb.value;


                    renderTeam(
                        TEAMS.tigers,

                        processTeam(
                            TEAMS.tigers,
                            mlb.value
                        )
                    );


                    renderTeam(
                        TEAMS.giants,

                        processTeam(
                            TEAMS.giants,
                            mlb.value
                        )
                    );
                }
                else
                {
                    console.error(
                        "MLB fetch failed",
                        mlb.reason
                    );
                }


                /****************************************************
                 *
                 * NFL
                 *
                 ****************************************************/

                if (
                    nfl.status ===
                    "fulfilled"
                )
                {
                    STATE.lastGood.nfl =
                        nfl.value;


                    renderTeam(
                        TEAMS.lions,

                        processTeam(
                            TEAMS.lions,
                            nfl.value
                        )
                    );


                    renderTeam(
                        TEAMS.commanders,

                        processTeam(
                            TEAMS.commanders,
                            nfl.value
                        )
                    );
                }
                else
                {
                    console.error(
                        "NFL fetch failed",
                        nfl.reason
                    );
                }


                /****************************************************
                 *
                 * NCAA
                 *
                 ****************************************************/

                if (
                    cfb.status ===
                    "fulfilled"
                )
                {
                    STATE.lastGood.cfb =
                        cfb.value;


                    renderTeam(
                        TEAMS.michigan,

                        processTeam(
                            TEAMS.michigan,
                            cfb.value
                        )
                    );


                    renderTeam(
                        TEAMS.msu,

                        processTeam(
                            TEAMS.msu,
                            cfb.value
                        )
                    );
                }
                else
                {
                    console.error(
                        "CFB fetch failed",
                        cfb.reason
                    );
                }


                STATE.lastRefresh =
                    new Date();


                updateDebug();
            }
            catch (
                error
            )
            {
                /*
                 * Deliberately NO visual error state.
                 *
                 * Whatever was already on the wall remains there.
                 */

                console.error(
                    "Refresh error",
                    error
                );
            }
            finally
            {
                STATE.refreshing =
                    false;


                scheduleRefresh();
            }
        }


        /************************************************************
         *
         * REFRESH SCHEDULING
         *
         ************************************************************/

        function hasLiveGame()
        {
            return Object.values(
                STATE.games
            ).some(
                game =>
                    game
                        ?.status
                        ?.state ===
                    "in"
            );
        }


        function scheduleRefresh()
        {
            if (
                STATE.timer
            )
            {
                clearTimeout(
                    STATE.timer
                );
            }


            const interval =
                hasLiveGame()

                    ? CONFIG.refresh.live

                    : CONFIG.refresh.normal;


            STATE.timer =
                setTimeout(
                    refreshScores,
                    interval
                );
        }


        /************************************************************
         ************************************************************
         *
         * DEBUG
         *
         ************************************************************
         ************************************************************/

        function updateDebug()
        {
            if (!DEBUG)
            {
                return;
            }


            const week =
                getFootballWeek();


            const data =
            {
                now:
                    new Date()
                        .toString(),

                lastRefresh:
                    STATE.lastRefresh
                        ?.toString() ||
                    null,

                refreshInterval:
                    hasLiveGame()
                        ? "30 seconds"
                        : "60 seconds",

                requests:
                {
                    mlb:
                        buildMLBURL(),

                    nfl:
                        buildNFLURL(),

                    cfb:
                        buildCFBURL()
                },

                footballWeek:
                {
                    start:
                        week.start
                            .toString(),

                    end:
                        week.end
                            .toString()
                },

                normalizedGames:
                    STATE.games
            };


            document
                .getElementById(
                    "debug-panel"
                )
                .textContent =
                    JSON.stringify(
                        data,
                        null,
                        2
                    );
        }


        /************************************************************
         ************************************************************
         *
         * STARTUP
         *
         ************************************************************
         ************************************************************/

        function start()
        {
            createCards();


            if (DEBUG)
            {
                document.body.classList.add(
                    "debug"
                );
            }


            if (PREVIEW)
            {
                runPreview();

                updateDebug();

                return;
            }


            refreshScores();
        }


        start();

    </script>

</body>
</html>
