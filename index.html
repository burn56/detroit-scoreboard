<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Detroit Sports Board</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--text:#111;--muted:#555;--scheduled:#06c;--live:#c00;--final:#087b2f}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;padding:0;background:transparent!important;overflow:hidden!important;font-family:"Segoe UI",system-ui,sans-serif}
.wrapper{width:100%;padding:1rem;display:flex;justify-content:center}
.scoreboard{display:flex;flex-flow:row nowrap;justify-content:center;align-items:flex-start;gap:1.5rem;overflow:visible}
.team-card{display:none;width:240px;padding:1.25rem 1.5rem;border-radius:.75rem;background:#fff8b3;background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 60%),radial-gradient(circle at 70% 70%,rgba(255,255,255,.15),transparent 60%);box-shadow:0 8px 14px rgba(0,0,0,.2),0 0 0 2px rgba(0,0,0,.05);flex-direction:column;align-items:center;transform-origin:center}
.team-card.visible{display:flex}
.team-card[data-team="tigers"]{transform:rotate(-1.5deg)}.team-card[data-team="giants"]{transform:rotate(1deg)}.team-card[data-team="lions"]{transform:rotate(-.75deg)}.team-card[data-team="commanders"]{transform:rotate(1.25deg)}.team-card[data-team="michigan"]{transform:rotate(1.5deg)}.team-card[data-team="msu"]{transform:rotate(-1deg)}
.team-logo{width:80px;height:80px;margin-bottom:.4rem;border:2px solid rgba(0,0,0,.1);border-radius:50%;overflow:hidden;background:#fff}.team-logo img{width:100%;height:100%;object-fit:contain}
.team-league{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.team-name{margin-bottom:.25rem;font-size:1rem;font-weight:700;text-align:center;color:var(--text)}
.game-line{width:100%;min-height:1.4em;margin-top:.25rem;padding:.3rem;border-radius:6px;background:rgba(255,255,255,.4);font-weight:600;text-align:center;color:var(--text)}
.status-row{margin-top:.35rem;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.3rem;font-size:.8rem;color:var(--muted);text-align:center}
.status-pill{padding:.1rem .6rem;border:1px solid rgba(0,0,0,.2);border-radius:999px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}.status-pill.live{color:var(--live);border-color:var(--live)}.status-pill.final{color:var(--final);border-color:var(--final)}.status-pill.scheduled{color:var(--scheduled);border-color:var(--scheduled)}
.football-extra{display:none;width:100%;margin-top:.65rem}.team-card.football-live .football-extra{display:block}.football-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.football-box{padding:5px;border-radius:4px;background:rgba(255,255,255,.35);text-align:center;font-size:.7rem}.football-label{display:block;margin-bottom:2px;font-size:.55rem;color:var(--muted);text-transform:uppercase}
#preview-indicator{display:none;position:fixed;right:8px;bottom:8px;padding:5px 8px;border-radius:5px;background:#111;color:#fff;font-size:10px;z-index:9999}body.preview #preview-indicator{display:block}

/************************************************************
 * LAMPLIGHT PARK LIVE BASEBALL TAKEOVER
 * Geometry locked to approved v14 calibration.
 ************************************************************/
.lp-shell{position:relative;width:min(100vw,177.683vh);aspect-ratio:1672/941;overflow:hidden}
.lp-shell>img.lp-art{position:absolute;inset:0;width:100%;height:100%;display:block}
.lp-team{position:absolute;left:13.839%;width:18.8%;height:8.1%;display:flex;align-items:center;gap:1.8%;color:#eee4c9;font-family:Georgia,"Times New Roman",serif;font-weight:900;font-size:clamp(13px,2vw,34px);letter-spacing:.04em;text-shadow:0 2px 3px #000}
.lp-team.away{top:46.607%}.lp-team.home{top:55.407%}
.lp-logo{width:19%;height:68%;object-fit:contain;filter:drop-shadow(0 2px 2px #000)}.lp-abbr{white-space:nowrap}
.lp-cell{position:absolute;display:grid;place-items:center;color:#eee3c6;font-family:"Arial Narrow",Impact,sans-serif;font-weight:900;font-size:clamp(15px,2.15vw,37px);line-height:1;text-shadow:0 2px 3px #000}.lp-cell.empty{color:#716d60}
.lp-row-away{top:46.884%}.lp-row-home{top:55.694%}.lp-score{width:3.45%;height:7.55%}
.lp-rhe-away{top:46.884%!important}.lp-rhe-home{top:55.694%!important}
.lp-c1{left:31.227%}.lp-c2{left:35.637%}.lp-c3{left:40.047%}.lp-c4{left:44.457%}.lp-c5{left:48.867%}.lp-c6{left:53.277%}.lp-c7{left:57.687%}.lp-c8{left:62.097%}.lp-c9{left:66.507%}
.lp-cR{left:73.924%}.lp-cH{left:79.704%}.lp-cE{left:85.494%}
.lp-value{position:absolute;display:grid;place-items:center;color:#eee3c6;font-weight:900;font-size:clamp(15px,2.2vw,38px);line-height:1;text-shadow:0 2px 3px #000}
.lp-atbat{left:11.569%;top:73.508%;width:6.65%;height:7.35%;display:block}.lp-atbat span,.lp-pitcher span{position:absolute;top:50%;transform:translateY(-50%)}
.lp-atbat-left{left:calc(50% - 13px)}.lp-atbat-right{left:calc(50% + 4px)}
.lp-pitcher{left:55.469%;top:73.508%;width:6.65%;height:7.35%;display:block}.lp-pitcher-left{left:calc(50% - 10px)}.lp-pitcher-right{left:calc(50% + 8px)}
.lp-inning{left:68.919%;top:73.295%;width:3.45%;height:7.35%}
.lp-bulb{position:absolute;width:1.72%;aspect-ratio:1;border-radius:50%;opacity:0;box-shadow:0 0 1.1vw .25vw currentColor}.lp-bulb.on{opacity:.92}.lp-ball,.lp-strike{color:#f4bd48;background:#e8a92d}.lp-out{color:#e45036;background:#c93827}
.lp-ball{top:74.952%;margin-left:-1px}.lp-strike{top:74.952%;margin-left:-1px}.lp-out{top:74.952%;margin-left:-1px}
.lp-b1{left:22.520%;margin-left:0;transform:translateY(1px)}.lp-b2{left:25.498%;margin-left:0;transform:translateY(1px)}.lp-b3{left:27.638%;transform:translate(4px,1px)}
.lp-s1{left:33.620%;margin-left:0;transform:translateY(1px)}.lp-s2{left:35.940%;transform:translate(4px,1px)}
.lp-o1{left:43.082%;margin-left:0;transform:translateY(1px)}.lp-o2{left:45.402%;transform:translate(4px,1px)}.lp-o3{left:47.722%}
.lp-base{position:absolute;width:1.92%;aspect-ratio:1;transform:rotate(45deg);opacity:0;box-shadow:0 0 .9vw .16vw #f0b13b}.lp-base.on{background:rgba(240,177,57,.88);opacity:.9}
.lp-base2{left:83.409%;top:69.526%}.lp-base1{left:85.719%;top:74.025%}.lp-base3{left:81.099%;top:74.025%}
.lp-half{position:absolute;left:72.42%;top:73.54%;width:2.55%;height:5.35%;display:grid;place-items:center;background:#101714;border:1px solid rgba(178,142,80,.55);box-shadow:inset 0 0 5px #000,0 1px 2px #000;font-size:0}
.lp-half::after{content:"";display:block;width:0;height:0;border-left:clamp(5px,.48vw,8px) solid transparent;border-right:clamp(5px,.48vw,8px) solid transparent;border-top:clamp(8px,.72vw,12px) solid #d6a04a;filter:drop-shadow(0 0 3px rgba(214,160,74,.65))}
.lp-half.top::after{border-top:0;border-bottom:clamp(8px,.72vw,12px) solid #d6a04a}
.lp-shell.no-player-numbers .lp-atbat,.lp-shell.no-player-numbers .lp-pitcher{color:transparent}

/************************************************************
 * LAMPLIGHT STADIUM LIVE FOOTBALL TAKEOVER
 * Geometry locked to approved v12 calibration.
 ************************************************************/
body.live-takeover{background:#000!important}
body.live-takeover .wrapper{display:none}
#live-takeover-stage{display:none;position:fixed;inset:0;z-index:5000;align-items:center;justify-content:center;background:#000}
body.live-takeover #live-takeover-stage{display:flex}
.live-boards{width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:1vw}
.live-boards.two .lp-shell{width:min(49vw,87.05vh)}
.live-boards.two .ls-shell{width:min(49vw,98vh)}




.ls-shell{position:relative;width:min(100vw,200vh);aspect-ratio:1774/887;overflow:hidden}
.ls-art{position:absolute;inset:0;width:100%;height:100%;display:block}
.ls-dynamic{position:absolute;display:flex;align-items:center;justify-content:center;color:#f3e7c7;font-family:Impact,"Arial Narrow",sans-serif;font-weight:900;line-height:1;text-shadow:0 2px 4px #000}

/* Team logo windows */
.ls-team{font-family:Georgia,serif}
.ls-team img{width:72%;height:72%;object-fit:contain;filter:drop-shadow(0 2px 3px #000)}
.ls-away-team{left:10.10%;top:43.15%;width:10.10%;height:11.55%}
.ls-home-team{left:68.55%;top:43.15%;width:10.10%;height:11.55%}

/* Score windows */
.ls-score{top:43.15%;width:10.05%;height:11.55%;font-size:clamp(20px,3.7vw,64px);letter-spacing:.02em}
.ls-away-score{left:21.20%}
.ls-home-score{left:79.55%}

/* Center clock windows */
.ls-quarter{left:36.75%;top:43.55%;width:7.75%;height:10.95%;font-size:clamp(20px,3.15vw,54px)}
.ls-clock{left:48.05%;top:43.55%;width:15.20%;height:10.95%;font-size:clamp(20px,3.25vw,56px);letter-spacing:.015em}

/* Lower number windows */
.ls-down{left:26.45%;top:62.25%;width:4.45%;height:7.55%;font-size:clamp(18px,2.65vw,46px)}
.ls-togo{left:37.45%;top:62.25%;width:5.35%;height:7.55%;font-size:clamp(18px,2.65vw,46px)}
.ls-ballon{left:49.15%;top:62.25%;width:5.75%;height:7.55%;font-size:clamp(18px,2.65vw,46px)}

/* Possession is a lamp/indicator, not another giant score */
.ls-possession{left:61.60%;top:62.25%;width:9.35%;height:7.55%;font-size:clamp(11px,1.35vw,24px);color:#f0b13b;letter-spacing:.03em}

/* Timeout bulbs aligned to the physical rings */
.ls-timeout{position:absolute;top:63.65%;width:2.15%;aspect-ratio:1;border-radius:50%;opacity:0;background:#f0b13b;box-shadow:0 0 .55vw .10vw #f0b13b}
.ls-timeout.on{opacity:.88}
.ls-a1{left:12.05%}.ls-a2{left:15.15%}.ls-a3{left:18.25%}
.ls-h1{left:77.45%}.ls-h2{left:80.55%}.ls-h3{left:83.65%}

/* Last play belongs inside the large blank lower display */
.ls-last-play{left:11.60%;top:76.75%;width:76.75%;height:5.55%;justify-content:flex-start;padding:0 1.15%;font-family:Georgia,serif;font-size:clamp(9px,1.15vw,20px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* v5 screenshot calibration */
.ls-away-team,.ls-home-team{transform:translateY(6px)}
.ls-away-score,.ls-home-score{transform:translateY(3px)}

.ls-a1,.ls-a2,.ls-a3{margin-left:2px;transform:translateY(4px)}
.ls-h1,.ls-h2,.ls-h3{margin-left:6px;transform:translateY(2px)}

.ls-down,.ls-togo,.ls-ballon{transform:translate(6px,4px)}
.ls-possession{transform:translate(4px,4px)}
.ls-last-play{transform:translateY(5px)}


/* v6 screenshot calibration */
.ls-away-score{margin-left:3px}
.ls-clock{transform:translateX(6px)}
.ls-away-team,.ls-home-team{margin-top:-3px}
.ls-down{margin-left:-2px}
.ls-togo{margin-left:-1px}
.ls-ballon{margin-left:2px}
.ls-a1,.ls-a2,.ls-a3,.ls-h1,.ls-h2,.ls-h3{margin-left:1px;margin-top:3px}
.ls-quarter{transform:translateX(-2px)}


/* v7 timeout calibration */
.ls-a1,.ls-a2,.ls-a3{transform:translate(-1px,1px)}
.ls-h1,.ls-h2,.ls-h3{margin-left:4px}


/* v8 timeout calibration */
.ls-a1,.ls-a2,.ls-a3{margin-left:2px}
.ls-h1,.ls-h2,.ls-h3{margin-left:9px;margin-top:2px}


/* v9 alternate-state validation + mechanical possession indicator */
.ls-possession{gap:8px}
.ls-poss-team{display:inline-block}
.ls-poss-lamp{
    display:inline-block;
    width:13px;
    height:13px;
    border-radius:50%;
    background:#e8a92d;
    border:1px solid #f6d27a;
    box-shadow:0 0 7px 2px rgba(240,177,59,.72), inset 0 0 3px rgba(255,255,255,.55);
}


/* v11 possession treatment: illuminated team abbreviation only */
.ls-possession{gap:0}
.ls-poss-team{
    color:#f3bd4f;
    text-shadow:
        0 0 3px rgba(240,177,59,.85),
        0 0 7px rgba(240,177,59,.45),
        0 2px 3px #000;
}
.ls-poss-lamp{display:none!important}


/* v12 possession + page background */

.ls-possession{transform:translate(9px,4px)}
.ls-poss-team{
    color:#f3e7c7;
    text-shadow:0 2px 4px #000;
}


.ls-shell{position:relative;width:min(100vw,200vh);aspect-ratio:1774/887;overflow:hidden}
.ls-art{position:absolute;inset:0;width:100%;height:100%;display:block}



/************************************************************
 * LAMPLIGHT COURT LIVE WNBA TAKEOVER
 * Geometry locked to approved v13 calibration.
 ************************************************************/
.lc-shell{
    position:relative;
    width:min(100vw,266.6667vh);
    aspect-ratio:2048/768;
    overflow:hidden;
}
.lc-art{position:absolute;inset:0;width:100%;height:100%;display:block}

    position:absolute;
    display:flex;

    color:#f3e7c7;
    font-family:Impact,"Arial Narrow",sans-serif;

}

/* Team logo windows */
.lc-team img{
    width:78%;height:78%;
    object-fit:contain;
    filter:drop-shadow(0 2px 3px #000);
}
.lc-away-team{left:34.55%;top:13.05%;width:4.75%;height:11.85%}

}
.lc-away-fouls{left:40.15%}
.lc-home-fouls{left:56.30%}

/* Timeout bulbs */
.lc-timeout{
    position:absolute;
    top:30.15%;
    width:1.05%;
    aspect-ratio:1;
    border-radius:50%;
    opacity:0;
    background:#e8a92d;
    box-shadow:0 0 .55vw .10vw #f0b13b;
}
.lc-timeout.on{opacity:.9}
.lc-a1{left:35.18%}.lc-a2{left:36.43%}.lc-a3{left:37.68%}
.lc-h1{left:62.05%}.lc-h2{left:63.30%}.lc-h3{left:64.55%}

/* v2: slightly smaller Jumbotron typography */
.lc-score{font-size:clamp(20px,3.65vw,63px)}
.lc-quarter{font-size:clamp(15px,2.05vw,35px)}
.lc-clock{font-size:clamp(16px,2.65vw,46px)}
.lc-shot-clock{font-size:clamp(16px,2.45vw,42px)}
.lc-fouls{font-size:clamp(13px,1.75vw,30px)}


/* v3: sized for real basketball ranges, including 3-digit scores */
.lc-score{font-size:clamp(16px,2.85vw,49px);letter-spacing:-.015em}
.lc-quarter{font-size:clamp(13px,1.60vw,28px)}
.lc-clock{font-size:clamp(14px,2.05vw,36px);letter-spacing:.015em}
.lc-shot-clock{font-size:clamp(14px,1.90vw,33px)}
.lc-fouls{font-size:clamp(12px,1.35vw,24px)}


/* v4: deliberately conservative sizing with room for 3-digit scores */
.lc-score{font-size:clamp(13px,2.05vw,36px);letter-spacing:-.02em}
.lc-quarter{font-size:clamp(11px,1.20vw,21px)}
.lc-clock{font-size:clamp(12px,1.55vw,27px);letter-spacing:.01em}
.lc-shot-clock{font-size:clamp(12px,1.45vw,25px)}
.lc-fouls{font-size:clamp(10px,1.05vw,19px)}


/* v5: stress-test triple-digit score + 5-character clock */
.lc-score{
    font-size:clamp(12px,1.75vw,31px);
    letter-spacing:-.035em;
    white-space:nowrap;
}
.lc-clock{
    font-size:clamp(11px,1.35vw,24px);
    letter-spacing:0;
    white-space:nowrap;
}
.lc-shot-clock{font-size:clamp(11px,1.25vw,22px)}

/* Timeout lamps reduced to fit the physical unlit bulb locations */
.lc-timeout{
    width:.68%;
    top:30.38%;
    box-shadow:0 0 .30vw .055vw #f0b13b;
}
.lc-a1{left:35.31%}.lc-a2{left:36.56%}.lc-a3{left:37.81%}
.lc-h1{left:62.18%}.lc-h2{left:63.43%}.lc-h3{left:64.68%}


/* v6: finer sizing adjustments from v5 screenshot */
.lc-fouls{font-size:clamp(7px,.55vw,11px)}
.lc-timeout{
    width:.52%;
    top:30.48%;
    box-shadow:0 0 .22vw .04vw #f0b13b;
}
.lc-shot-clock{font-size:clamp(10px,1.12vw,20px)}

/* Re-center smaller timeout lamps over the physical bulb spots */
.lc-a1{left:35.39%}.lc-a2{left:36.64%}.lc-a3{left:37.89%}
.lc-h1{left:62.26%}.lc-h2{left:63.51%}.lc-h3{left:64.76%}


/* v7: requested fine calibration */
.lc-fouls{
    font-size:clamp(6px,.50vw,10px);
    transform:translateY(2px);
}
.lc-timeout{
    width:.56%;
    top:30.46%;
}
/* Right-side timeout group: 2px right */
.lc-h1,.lc-h2,.lc-h3{transform:translateX(2px)}


/* v8: individual outer timeout calibration */
/* Left group #1 = far-left bulb: 2px right */
.lc-a1{transform:translateX(2px)}
/* Right group #1 = far-right bulb (h3): retain group +2px, then 1px left */
.lc-h3{transform:translateX(1px)}


/* v9: individual outer timeout calibration */
/* Left #1: 1px left from v8 */
.lc-a1{transform:translateX(1px)}
/* Right #1: 1px left from v8 */
.lc-h3{transform:translateX(0)}


/* v10: right outer timeout #1 another 1px left from v9 */
.lc-h3{transform:translateX(-1px)}


/* v11: right outer timeout #1 another 2px left from v10 */
.lc-h3{transform:translateX(-3px)}


/* v12: right outer timeout #1 another 2px left from v11 */
.lc-h3{transform:translateX(-5px)}


/* v13: far-right timeout another 2px left from v12 */
.lc-h3{transform:translateX(-7px)}

/************************************************************
 * AUDITED SCALE-SAFE CALIBRATION
 * Canonical approved shell width: 430 CSS px.
 * Every former px/vw/clamp calibration is expressed as a
 * percentage of board WIDTH (cqw), including vertical nudges.
 ************************************************************/
.lp-shell,.ls-shell,.lc-shell{container-type:inline-size}

/* ---------- LAMPLIGHT PARK ---------- */
.lp-team{font-size:3.023256cqw}
.lp-cell{font-size:3.488372cqw}
.lp-value{font-size:3.488372cqw}
.lp-atbat-left{left:calc(50% - 3.023256cqw)}
.lp-atbat-right{left:calc(50% + .930233cqw)}
.lp-pitcher-left{left:calc(50% - 2.325581cqw)}
.lp-pitcher-right{left:calc(50% + 1.860465cqw)}
.lp-ball,.lp-strike,.lp-out{margin-left:-.232558cqw}
.lp-b1,.lp-b2,.lp-s1,.lp-o1{margin-left:0;transform:translateY(.232558cqw)}
.lp-b3,.lp-s2,.lp-o2{transform:translate(.930233cqw,.232558cqw)}
.lp-half{border-width:.232558cqw;box-shadow:inset 0 0 1.162791cqw #000,0 .232558cqw .465116cqw #000}
.lp-half::after{border-left-width:1.162791cqw;border-right-width:1.162791cqw;border-top-width:1.860465cqw;filter:drop-shadow(0 0 .697674cqw rgba(214,160,74,.65))}
.lp-half.top::after{border-top-width:0;border-bottom-width:1.860465cqw}

/* ---------- LAMPLIGHT STADIUM ---------- */
.ls-score{font-size:4.651163cqw}
.ls-quarter{font-size:4.651163cqw}
.ls-clock{font-size:4.651163cqw}
.ls-down,.ls-togo,.ls-ballon{font-size:4.186047cqw}
.ls-possession{font-size:2.558140cqw}
.ls-last-play{font-size:2.093023cqw}

.ls-dynamic{text-shadow:0 .465116cqw .930233cqw #000}

function getZonedDateParts(date){
 const p=new Intl.DateTimeFormat("en-US",{timeZone:CONFIG.timeZone,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date),v={};
 p.forEach(x=>{if(x.type!=="literal")v[x.type]=x.value});
 return{year:+v.year,month:+v.month,day:+v.day};
}
function getDayNumber(date){const p=getZonedDateParts(date);return Math.floor(Date.UTC(p.year,p.month-1,p.day)/86400000)}
function getDateKey(date){const p=getZonedDateParts(date);return String(p.year)+String(p.month).padStart(2,"0")+String(p.day).padStart(2,"0")}
function dateKeyFromDayNumber(n){const d=new Date(n*86400000);return String(d.getUTCFullYear())+String(d.getUTCMonth()+1).padStart(2,"0")+String(d.getUTCDate()).padStart(2,"0")}
function sourceUrl(source,dayNumber=null){
 if(source!=="mlb"&&source!=="wnba")return ESPN[source];
 const day=dayNumber==null?getDayNumber(new Date()):dayNumber;
 return ESPN[source]+(ESPN[source].includes("?")?"&":"?")+"dates="+dateKeyFromDayNumber(day);
}
async function fetchSourceData(source){
 if(source!=="mlb"&&source!=="wnba")return fetchJSON(sourceUrl(source));
 const today=getDayNumber(new Date());
 const results=await Promise.allSettled([
  fetchJSON(sourceUrl(source,today-1)),
  fetchJSON(sourceUrl(source,today))
 ]);
 const good=results.filter(x=>x.status==="fulfilled").map(x=>x.value);
 if(!good.length)throw(results[0].reason||results[1].reason||new Error(source+" fetch failed"));
 const merged=Object.assign({},good[good.length-1]);
 const byId=new Map();
 good.forEach(data=>(data.events||[]).forEach(e=>byId.set(String(e.id),e)));
 merged.events=[...byId.values()];
 return merged;
}
function getFootballWindow(){const today=getDayNumber(new Date()),weekday=new Date(today*86400000).getUTCDay(),sinceTuesday=(weekday-2+7)%7;return{start:today-sinceTuesday,end:today-sinceTuesday+6}}
function getEventDayNumber(event){return getDayNumber(new Date(event.date))}
function formatGameTime(s){return new Intl.DateTimeFormat("en-US",{timeZone:CONFIG.timeZone,weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).format(new Date(s))}
function eventContainsTeam(event,abbr){const c=event.competitions&&event.competitions[0];return!!(c&&c.competitors&&c.competitors.some(x=>x.team&&x.team.abbreviation===abbr))}
function selectTeamEvent(team,data){
 const events=data&&Array.isArray(data.events)?data.events:[],matches=events.filter(e=>eventContainsTeam(e,team.abbr));
 if(team.sport==="baseball"||team.sport==="basketball"){
  const today=getDayNumber(new Date()),todayGame=matches.find(e=>getEventDayNumber(e)===today);
  if(todayGame)return todayGame;
  const recent=matches.filter(e=>getEventDayNumber(e)===today-1&&e.status&&e.status.type&&e.status.type.state==="post")
   .sort((a,b)=>new Date(b.date)-new Date(a.date));
  return recent[0]||null;
 }
 const w=getFootballWindow(),week=matches.filter(e=>{const d=getEventDayNumber(e);return d>=w.start&&d<=w.end});
 if(!week.length)return null;
 const live=week.find(e=>e.status&&e.status.type&&e.status.type.state==="in");if(live)return live;
 const upcoming=week.filter(e=>e.status&&e.status.type&&e.status.type.state==="pre").sort((a,b)=>new Date(a.date)-new Date(b.date));if(upcoming.length)return upcoming[0];
 return week.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0];
}
function teamLogo(team){

}
function normalizeEvent(event,sport){
 if(!event)return null;const c=event.competitions&&event.competitions[0];if(!c)return null;
 const cs=c.competitors||[],home=cs.find(x=>x.homeAway==="home")||cs[0],away=cs.find(x=>x.homeAway==="away")||cs[1],status=event.status||{},type=status.type||{};
 const side=x=>({id:x&&(x.id||(x.team&&x.team.id)),abbr:x&&x.team&&x.team.abbreviation||"---",name:x&&x.team&&(x.team.displayName||x.team.shortDisplayName)||"",logo:x&&teamLogo(x.team),score:x?x.score:null,raw:x||{}});
 return{id:event.id,date:event.date,sport,state:type.state||"pre",detail:type.shortDetail||type.detail||"",period:status.period,clock:status.displayClock||"",home:side(home),away:side(away),situation:c.situation||{},competition:c,season:event.season||c.season||null,name:event.name||event.shortName||""};
}


function wpblAbbr(name){
 const words=String(name||"").trim().split(/\s+/).filter(Boolean);if(!words.length)return"";
 const place=words.slice(0,-1);if(place.length<=1)return String(place[0]||words[0]).slice(0,3).toUpperCase();
 return place.map(x=>x[0]).join("").slice(0,3).toUpperCase();
}
function wpblState(status,code){
 const s=String(status||"").toLowerCase();
 if(s.startsWith("final")||s.includes("complete"))return"post";
 if(s.includes("postponed")||s.includes("cancel")||s.includes("suspended")||s.includes("delay"))return"off";
 if(s.includes("in progress"))return"in";
 if(s.includes("not started")||s.includes("scheduled")||s.includes("pregame"))return"pre";
 if(Number(code)===-2)return"pre";if(Number(code)===-1)return"in";if(Number(code)===0)return"post";return"off";
}
function wpblInning(status,state){
 const m=String(status||"").match(/(\d+)\s*(?:st|nd|rd|th)\b/i);
 if(m)return Number(m[1]);const n=Number(state&&state.inning);return Number.isFinite(n)&&n>0?n:null;
}
function wpblTeamMap(data){
 const map={};for(const t of(data&&Array.isArray(data.teams)?data.teams:[]))map[String(t.team_id||"")]=t;return map;
}
function normalizeWpblGame(row,teams){
 const presto=row&&row.presto_data||{},live=row&&row.state||{},status=String(row&&row.status||presto.status||"");
 function side(which){
  const id=String(row&&row[which+"_team_id"]||""),t=teams[id]||{},local=WPBL_TEAMS[id]||null;
  const name=String((local&&local.name)||row&&row[which+"_team_name"]||t.team_name||"");
  const display=String((local&&local.nickname)||name.trim().split(/\s+/).pop()||wpblAbbr(name)).toUpperCase();
  const logo=(local&&local.logo)||t.logo_url||"";
  const liveScore=live[which+"_score"],prestoScore=presto.score&&presto.score[which];
  const score=liveScore!==undefined&&liveScore!==null?liveScore:(prestoScore!==undefined&&prestoScore!==null?prestoScore:null);
  return{id,abbr:display,name,logo,score:score===null?null:String(score),raw:{team:{id,abbreviation:display,displayName:name,logo},score}};
 }
 const home=side("home"),away=side("away"),period=wpblInning(status,live);
 const half=/top/i.test(status)?"top":/bottom/i.test(status)?"bottom":String(live.half||"").toLowerCase();
 const competition={competitors:[
  {id:away.id,homeAway:"away",score:away.score,team:{id:away.id,abbreviation:away.abbr,displayName:away.name,logo:away.logo},linescores:[],statistics:[]},
  {id:home.id,homeAway:"home",score:home.score,team:{id:home.id,abbreviation:home.abbr,displayName:home.name,logo:home.logo},linescores:[],statistics:[]}
 ]};
 return{id:String(row.game_id||""),date:row.scheduled_start,sport:"baseball",source:"wpbl",state:wpblState(status,presto.statusCode),detail:status,period,clock:"",home,away,
  situation:{inning:period,inningHalf:half,isTopInning:half==="top"},competition,season:{slug:"wpbl-2026"},name:(away.name||away.abbr)+" @ "+(home.name||home.abbr)};
}
function selectWpblGames(data,teamsData){
 const rows=data&&Array.isArray(data.games)?data.games:[],teams=wpblTeamMap(teamsData),today=getDayNumber(new Date()),seen=new Set(),out=[];
 for(const row of rows){
  if(!row||!row.game_id||!row.scheduled_start)continue;
  const day=getDayNumber(new Date(row.scheduled_start));
  if(day!==today&&day!==today-1)continue;
  const id=String(row.game_id);if(seen.has(id))continue;seen.add(id);
  const g=normalizeWpblGame(row,teams);
  if(!g.home.name||!g.away.name)continue;
  if(day===today-1&&(g.state!=="post"||!finalStillVisible(g)))continue;
  out.push(g);
 }
 return out.sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function findDeepNumber(obj,names){
 const wanted=new Set(names.map(x=>x.toLowerCase())),seen=new Set();
 function walk(v,depth){
  if(v==null||depth>8||typeof v!=="object"||seen.has(v))return null;seen.add(v);
  for(const [k,val] of Object.entries(v)){
   if(wanted.has(k.toLowerCase())&&(typeof val==="number"||/^\d+$/.test(String(val))))return Number(val);
  }
  for(const val of Object.values(v)){const x=walk(val,depth+1);if(x!=null)return x}
  return null;
 }
 return walk(obj,0);
}
function findDeepArray(obj,names){
 const wanted=new Set(names.map(x=>x.toLowerCase())),seen=new Set();
 function walk(v,depth){
  if(v==null||depth>8||typeof v!=="object"||seen.has(v))return null;seen.add(v);
  for(const [k,val] of Object.entries(v))if(wanted.has(k.toLowerCase())&&Array.isArray(val))return val;
  for(const val of Object.values(v)){const x=walk(val,depth+1);if(x)return x}
  return null;
 }
 return walk(obj,0);
}
function applyWpblBoxscore(g,data){
 if(!g||!data)return g;
 // The schedule feed is authoritative for score/status. Boxscore enrichment is best-effort
 // for the physical Lamplight Park inning/count/base displays.
 const innings=findDeepArray(data,["linescore","line_score","innings","inning_scores"]);
 if(Array.isArray(innings)){
  const awayComp=g.competition.competitors.find(x=>x.homeAway==="away"),homeComp=g.competition.competitors.find(x=>x.homeAway==="home");
  const av=[],hv=[];
  for(const x of innings){
   if(!x||typeof x!=="object")continue;
   const a=x.away_runs??x.away??x.awayScore??(x.score&&x.score.away),h=x.home_runs??x.home??x.homeScore??(x.score&&x.score.home);
   if(a!==undefined&&a!==null)av.push({value:Number(a)});if(h!==undefined&&h!==null)hv.push({value:Number(h)});
  }
  if(av.length)awayComp.linescores=av;if(hv.length)homeComp.linescores=hv;
 }
 const balls=findDeepNumber(data,["balls"]),strikes=findDeepNumber(data,["strikes"]),outs=findDeepNumber(data,["outs"]);
 if(balls!=null)g.situation.balls=balls;if(strikes!=null)g.situation.strikes=strikes;if(outs!=null)g.situation.outs=outs;
 const inning=findDeepNumber(data,["inning","current_inning"]);if(inning!=null&&inning>0){g.period=inning;g.situation.inning=inning}
 return g;
}
async function enrichLiveWpblGame(g){
 if(!g||g.state!=="in")return g;

 return g;
}

const FINAL_TTL_MS=24*60*60*1000;
function loadFinalSeen(){

}
function saveFinalSeen(){
 try{localStorage.setItem("lamplight-final-seen",JSON.stringify(STATE.finalSeen))}catch(e){}
}
function explicitEndTime(g){
 const c=g&&g.competition||{},s=c.status||{},t=s.type||{};
 const vals=[c.endDate,c.endTime,g&&g.endDate,g&&g.completedAt,t.completedAt,t.endDate];
 for(const v of vals){if(v){const n=Date.parse(v);if(Number.isFinite(n))return n}}
 return null;
}
function finalStillVisible(g){
 if(!g||g.state!=="post")return true;
 const id=String(g.id||g.name||g.date||"unknown"),now=Date.now();
 let end=explicitEndTime(g);
 if(!end){
  const scheduled=Date.parse(g.date||"");
  const estimated=Number.isFinite(scheduled)?scheduled+(5*60*60*1000):0;
  const firstSeen=Number(STATE.finalSeen[id])||0;
  if(!firstSeen){STATE.finalSeen[id]=now;saveFinalSeen()}
  end=estimated||firstSeen||now;
 }
 return now-end<FINAL_TTL_MS;

function seasonProgressWeight(key,g){
 if(g&&g.source==="wpbl"){
  const rows=STATE.lastGood.wpbl&&Array.isArray(STATE.lastGood.wpbl.games)?STATE.lastGood.wpbl.games:[];
  const dates=rows.map(x=>Date.parse(x.scheduled_start)).filter(Number.isFinite).sort((a,b)=>a-b);
  if(dates.length<2)return 0;const now=Date.parse(g.date||new Date()),p=Math.max(0,Math.min(1,(now-dates[0])/(dates[dates.length-1]-dates[0])));

 const t=TEAMS[key],data=t&&STATE.lastGood[t.source],league=data&&data.leagues&&data.leagues[0],season=league&&league.season;

function gameSituationWeight(g){
 let bonus=0;
 const a=Number(g.away&&g.away.score),h=Number(g.home&&g.home.score);
 const diff=Number.isFinite(a)&&Number.isFinite(h)?Math.abs(a-h):999;
 let late=false,close=false,ot=false;

 if(g.sport==="baseball"){
  late=Number(g.period)>=7;
  close=diff<=2;
  ot=Number(g.period)>9;
 }else if(g.sport==="football"){
  late=Number(g.period)>=4;
  close=diff<=8;
  ot=Number(g.period)>4||/ot|overtime/i.test(String(g.detail||""));
 }else if(g.sport==="basketball"){
  late=Number(g.period)>=4;
  close=diff<=8;
  ot=Number(g.period)>4||/ot|overtime/i.test(String(g.detail||""));
 }
 if(late)bonus+=LIVE_PRIORITY.lateGame;
 if(late&&close)bonus+=LIVE_PRIORITY.closeGame;

 return bonus;
}

    renderProductionTeam(key,t,selectTeamEvent(t,r.value));
    const g=STATE.games[key];
    if(g&&g.state==="in"&&t.sport==="football")enrich.push(enrichLiveFootballGame(g,source));
    if(g&&g.state==="in"&&t.sport==="basketball")enrich.push(enrichLiveBasketballGame(g));
   });
  });

  const wpblGamesResult=results[sources.length],wpblTeamsResult=results[sources.length+1];
  if(wpblGamesResult.status==="fulfilled")STATE.lastGood.wpbl=wpblGamesResult.value;else console.error("wpbl games fetch failed:",wpblGamesResult.reason);
  if(wpblTeamsResult.status==="fulfilled")STATE.lastGood.wpblTeams=wpblTeamsResult.value;else console.error("wpbl teams fetch failed:",wpblTeamsResult.reason);
  if(STATE.lastGood.wpbl&&STATE.lastGood.wpblTeams){
   removeWpblCards();
   Object.keys(STATE.games).filter(k=>k.startsWith("wpbl-")).forEach(k=>{delete STATE.games[k];delete STATE.gameMeta[k]});
   const wpblGames=selectWpblGames(STATE.lastGood.wpbl,STATE.lastGood.wpblTeams);
   for(const g of wpblGames){
    const key=renderWpblCard(g);STATE.games[key]=g;STATE.gameMeta[key]={sport:"baseball",source:"wpbl"};
    if(g.state==="in")enrich.push(enrichLiveWpblGame(g));
   }
  }
  if(enrich.length)await Promise.allSettled(enrich);
  refreshTakeover();
  if(DEBUG)console.log("Sports Board Debug",{date:getDateKey(new Date()),footballWindow:getFootballWindow(),games:STATE.games,lastGood:STATE.lastGood});
 }catch(e){console.error("Unexpected refresh error:",e)}
 finally{STATE.refreshing=false;scheduleNextRefresh()}
}
function scheduleNextRefresh(){if(STATE.timer)clearTimeout(STATE.timer);const live=Object.values(STATE.games).some(g=>g&&g.state==="in");STATE.timer=setTimeout(refreshProduction,live?CONFIG.refresh.liveMs:CONFIG.refresh.normalMs)}
