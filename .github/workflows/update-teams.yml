name: Update Team Catalog
on:
  push:
    branches: ["Custom-Teams-Display", "main"]
    paths:
      - ".github/workflows/update-teams.yml"
      - "builder.html"
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build teams.json
        run: |
          python - <<'PY'
          import json, urllib.request, datetime
          endpoints={
            "MLB":"https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/teams?limit=1000",
            "NFL":"https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams?limit=1000",
            "WNBA":"https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/teams?limit=1000",
            "CFB":"https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams?limit=700",
          }
          def get(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def extract(data):
            out={}
            def add(t):
              if not isinstance(t,dict): return
              ab=str(t.get("abbreviation","")).strip().upper()
              name=t.get("displayName") or t.get("shortDisplayName") or t.get("name")
              if not ab or not name: return
              logos=t.get("logos") or []
              logo=logos[0].get("href","") if logos and isinstance(logos[0],dict) else ""
              out[ab]={"name":name,"abbr":ab,"id":str(t.get("id","")),"logo":logo}
            def walk(x):
              if isinstance(x,list):
                for v in x: walk(v)
              elif isinstance(x,dict):
                if "abbreviation" in x and ("displayName" in x or "name" in x): add(x)
                if isinstance(x.get("team"),dict): add(x["team"])
                for v in x.values(): walk(v)
            walk(data)
            return sorted(out.values(),key=lambda x:x["name"])
          try: old=json.load(open("teams.json")).get("leagues",{})
          except: old={}
          leagues={}
          for key,url in endpoints.items():
            try:
              leagues[key]=extract(get(url))
              print(key, len(leagues[key]), "teams")
              if not leagues[key]: raise RuntimeError("ESPN returned data but parser found zero teams")
            except Exception as e:
              print(key,"failed:",e)
              leagues[key]=old.get(key,[])
          leagues["WPBL"]=old.get("WPBL",[
            {"name":"Boston Hunters","abbr":"9f08or2mffx81409","id":"9f08or2mffx81409","logo":"logos/IMG_0725.png"},
            {"name":"Los Angeles Queens","abbr":"v4gisr4rbgmn67b0","id":"v4gisr4rbgmn67b0","logo":"logos/IMG_0724.png"},
            {"name":"New York Heights","abbr":"fttth861nft1j2s7","id":"fttth861nft1j2s7","logo":"logos/IMG_0727.png"},
            {"name":"San Francisco Firebells","abbr":"vhubhz8li07tmgq8","id":"vhubhz8li07tmgq8","logo":"logos/IMG_0726.png"}])
          json.dump({"generated":datetime.datetime.now(datetime.timezone.utc).isoformat(),"source":"ESPN","leagues":leagues},open("teams.json","w"),indent=2)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet -- teams.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add teams.json
          git commit -m "Update team catalog"
          git push
