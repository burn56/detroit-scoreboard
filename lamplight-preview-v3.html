<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lamplight Park Calibrated Preview</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
body{font-family:"Arial Narrow","Roboto Condensed","Helvetica Neue Condensed",Impact,sans-serif}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07101a}
.shell{position:relative;width:min(100vw,177.683vh);aspect-ratio:1672/941}
.shell>img{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Calibrated against the actual 1672 x 941 approved shell. */
.team{
 position:absolute;left:10.969%;width:18.8%;height:8.1%;
 display:flex;align-items:center;gap:1.8%;color:#eee4c9;
 font-family:Georgia,"Times New Roman",serif;font-weight:900;
 font-size:clamp(13px,2.0vw,34px);letter-spacing:.04em;text-shadow:0 2px 3px #000
}
.team.away{top:45.863%}.team.home{top:54.663%}
.logo{width:19%;height:68%;object-fit:contain;filter:drop-shadow(0 2px 2px #000)}
.abbr{white-space:nowrap}

.cell{
 position:absolute;display:grid;place-items:center;color:#eee3c6;
 font-family:"Arial Narrow",Impact,sans-serif;font-weight:900;
 font-size:clamp(15px,2.15vw,37px);line-height:1;text-shadow:0 2px 3px #000
}
.cell.empty{color:#716d60}
.row-away{top:46.033%}.row-home{top:54.843%}
.score{width:3.45%;height:7.55%}
.c1{left:30.869%}.c2{left:35.279%}.c3{left:39.689%}.c4{left:44.099%}.c5{left:48.509%}
.c6{left:52.919%}.c7{left:57.329%}.c8{left:61.739%}.c9{left:66.149%}
.cR{left:72.489%}.cH{left:78.149%}.cE{left:83.819%}

.value{
 position:absolute;display:grid;place-items:center;color:#eee3c6;
 font-weight:900;font-size:clamp(15px,2.2vw,38px);line-height:1;text-shadow:0 2px 3px #000
}
.atbat{left:11.569%;top:72.763%;width:6.65%;height:7.35%}
.pitcher{left:55.469%;top:72.763%;width:6.65%;height:7.35%}
.inning{left:68.799%;top:72.763%;width:3.45%;height:7.35%}

.bulb{
 position:absolute;width:1.72%;aspect-ratio:1;border-radius:50%;
 opacity:0;box-shadow:0 0 1vw .22vw currentColor
}
.bulb.on{opacity:.88}
.ball,.strike{color:#f6bf49;background:#e4a52c}
.out{color:#ed5138;background:#c93a27}
.bulb{top:74.633%}
.b1{left:22.879%}.b2{left:25.199%}.b3{left:27.519%}
.s1{left:34.039%}.s2{left:36.359%}
.o1{left:43.799%}.o2{left:46.119%}.o3{left:48.439%}

.base{
 position:absolute;width:1.92%;aspect-ratio:1;transform:rotate(45deg);
 opacity:0;box-shadow:0 0 .9vw .16vw #f0b13b
}
.base.on{background:rgba(240,177,57,.88);opacity:.9}
.base2{left:83.469%;top:69.313%}.base1{left:85.839%;top:73.493%}.base3{left:81.099%;top:73.493%}
.half{
 position:absolute;left:72.50%;top:73.76%;width:2.15%;height:4.35%;
 display:grid;place-items:center;font-size:0
}
.half::after{
 content:"";display:block;width:0;height:0;
 border-left:clamp(5px,.55vw,9px) solid transparent;
 border-right:clamp(5px,.55vw,9px) solid transparent;
 border-top:clamp(8px,.8vw,13px) solid #dca451;
 filter:drop-shadow(0 0 5px #c7802c)
}
.half.top::after{
 border-top:0;
 border-bottom:clamp(8px,.8vw,13px) solid #dca451;
}
</style>
</head>
<body>
<div class="stage">
 <div class="shell">
  <img src="lamplight-park.png" alt="Lamplight Park">
  <div class="team away"><img class="logo" id="away-logo" alt=""><span class="abbr" id="away-abbr"></span></div>
  <div class="team home"><img class="logo" id="home-logo" alt=""><span class="abbr" id="home-abbr"></span></div>
  <div id="scores"></div>
  <div class="value atbat" id="atbat"></div>
  <div class="value pitcher" id="pitcher"></div>
  <div class="value inning" id="inning"></div>
  <div class="half" id="half"></div>
  <i class="bulb ball b1"></i><i class="bulb ball b2"></i><i class="bulb ball b3"></i>
  <i class="bulb strike s1"></i><i class="bulb strike s2"></i>
  <i class="bulb out o1"></i><i class="bulb out o2"></i><i class="bulb out o3"></i>
  <i class="base base2"></i><i class="base base1"></i><i class="base base3"></i>
 </div>
</div>
<script>
"use strict";

/*
 * This preview deliberately uses ESPN-hosted team artwork rather than
 * local sticky-note assets. Production will take these URLs directly
 * from competition.competitors[].team.logo / team.logos[].
 */
const PREVIEW = {
 away:{
  abbr:"CLE",
  logo:"https://a.espncdn.com/i/teamlogos/mlb/500/cle.png",
  innings:[0,0,1,0,1,0,null,null,null],r:2,h:5,e:0
 },
 home:{
  abbr:"DET",
  logo:"https://a.espncdn.com/i/teamlogos/mlb/500/det.png",
  innings:[1,0,0,2,0,1,null,null,null],r:4,h:7,e:1
 },
 balls:2,strikes:1,outs:1,inning:6,half:"bottom",
 atBat:"24",pitcher:"29",bases:{first:true,second:false,third:true}
};

function setTeam(side,data){
 document.getElementById(side+"-abbr").textContent=data.abbr;
 const img=document.getElementById(side+"-logo");
 img.src=data.logo; img.alt=data.abbr;
}
function addCell(row,col,value){
 const el=document.createElement("div");
 el.className="cell score "+row+" "+col+(value==null?" empty":"");
 el.textContent=value==null?"–":value;
 document.getElementById("scores").appendChild(el);
}
function row(cls,t){
 t.innings.forEach((v,i)=>addCell(cls,"c"+(i+1),v));
 addCell(cls,"cR",t.r); addCell(cls,"cH",t.h); addCell(cls,"cE",t.e);
}
function light(selector,count){
 document.querySelectorAll(selector).forEach((x,i)=>x.classList.toggle("on",i<count));
}
setTeam("away",PREVIEW.away); setTeam("home",PREVIEW.home);
row("row-away",PREVIEW.away); row("row-home",PREVIEW.home);
document.getElementById("atbat").textContent=PREVIEW.atBat;
document.getElementById("pitcher").textContent=PREVIEW.pitcher;
document.getElementById("inning").textContent=PREVIEW.inning;
document.getElementById("half").classList.toggle("top",PREVIEW.half==="top");
light(".ball",PREVIEW.balls); light(".strike",PREVIEW.strikes); light(".out",PREVIEW.outs);
document.querySelector(".base1").classList.toggle("on",PREVIEW.bases.first);
document.querySelector(".base2").classList.toggle("on",PREVIEW.bases.second);
document.querySelector(".base3").classList.toggle("on",PREVIEW.bases.third);
</script>
</body>
</html>
